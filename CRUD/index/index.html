<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD de Carros</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="logo">Gerenciamento de Carros</div>
    </nav>

    
    <div id="alert-container"></div>
    

    <div class="container">
        <h1>CRUD de Carros</h1>

        <div class="form-group">
            <label for="placa">Placa do Veículo</label>
            <input type="text" class="input-text" id="placa" placeholder="Digite a placa" maxlength="7">
        </div>

        <div class="form-group">
            <label for="marca">Marca do Veículo</label>
            <input type="text" class="input-text" id="marca" placeholder="Digite a marca">
        </div>

        <div class="form-group">
            <label for="modelo">Modelo do Veículo</label>
            <input type="text" class="input-text" id="modelo" placeholder="Digite o modelo">
        </div>

        <div class="form-group">
            <label for="ano">Ano do Veículo</label>
            <input type="number" class="input-text" id="ano" placeholder="Digite o ano">
        </div>

        <button class="btn-add" onclick="AdicionarCarro()">Adicionar</button>

        <table class="car-table" id="listaDeCarros">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Placa</th>
                    <th>Marca</th>
                    <th>Modelo</th>
                    <th>Ano</th>
                    <th>Editar</th> 
                    <th>Excluir</th>
                </tr>
            </thead>
            <tbody>
                <!-- As linhas serão adicionadas aqui pelo JavaScript -->
            </tbody>
        </table> 
    </div>

    <script src="../js/CRUD.js"></script>
</body>
</html>
